name: One-off Tibicen 1.5.0 operations

on:
  push:
    branches: [codex/release-1.5.0-ops]

permissions: {}

concurrency:
  group: release-1.5.0-ops
  cancel-in-progress: false


jobs:
  pages-audit:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'warbr1ng3r/tibicen' &&
      github.ref == 'refs/heads/codex/release-1.5.0-ops' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'release-1.5.0-ops: pages-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    env:
      AUDIT_CONFIG_SHA256: "187fc0387102515daec27a1078ff1132336051023c3a0bd4ab8c31d0d1b0edaa"
      AUDIT_SCRIPT_SHA256: "428913c9ba970f1ff7e11faceb0517c57e63a8aefdc2d1ad0d6c4c117303bc1e"
      RETURNED_VERIFIER_SHA256: "387b24d630768bbc4697d7ea875f982570b600b0dd4532142b38a1d11e7ce6f6"
    steps:
      - name: Require exact reviewed hashes
        shell: bash
        run: |
          set -euo pipefail
          for tibicen_name in AUDIT_CONFIG_SHA256 AUDIT_SCRIPT_SHA256 RETURNED_VERIFIER_SHA256; do
            [[ "${!tibicen_name}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          done

      - name: Read only the exact operations commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve the official artifact and compare all returned public bodies once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          for name, variable in [
              ('pages-audit.json', 'AUDIT_CONFIG_SHA256'),
              ('pages-audit.py', 'AUDIT_SCRIPT_SHA256'),
              ('pages-verify-returned.py', 'RETURNED_VERIFIER_SHA256'),
          ]:
              file = Path('.release-1.5.0') / name
              assert file.is_file() and not file.is_symlink()
              assert hashlib.sha256(file.read_bytes()).hexdigest() == os.environ[variable]
          PY
          python3 .release-1.5.0/pages-audit.py .release-1.5.0/pages-audit.json \
            "$RUNNER_TEMP/tibicen-1.5.0-pages-audit-$GITHUB_RUN_ID"

      - name: Retain official artifact and verification receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tibicen-1.5.0-pages-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tibicen-1.5.0-pages-audit-${{ github.run_id }}/*.json
            ${{ runner.temp }}/tibicen-1.5.0-pages-audit-${{ github.run_id }}/official-github-pages.zip
            ${{ runner.temp }}/tibicen-1.5.0-pages-audit-${{ github.run_id }}/returned-check/
          retention-days: 7
          if-no-files-found: warn
