name: One-off Tibicen 1.5.4 operations

on:
  push:
    branches: [codex/release-1.5.4-ops]

permissions: {}

concurrency:
  group: release-1.5.4-ops
  cancel-in-progress: false


jobs:
  pages-audit:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'warbr1ng3r/tibicen' &&
      github.ref == 'refs/heads/codex/release-1.5.4-ops' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'release-1.5.4-ops: pages-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    env:
      AUDIT_CONFIG_SHA256: "004c0a2e10946251ee26092a0e3d49b9ae900215861623a97d9709ef2d55823c"
      AUDIT_SCRIPT_SHA256: "8f27d73ed7f16f0438f9fbba98b3823edb58bf0b6071413a435dc1c24e9aa7e2"
      RETURNED_VERIFIER_SHA256: "5ef4199704df693487922ea8e30545f904c592b04309a70b4cbbe26d4af6c243"
    steps:
      - name: Require exact reviewed hashes
        shell: bash
        run: |
          set -euo pipefail
          for tibicen_name in AUDIT_CONFIG_SHA256 AUDIT_SCRIPT_SHA256 RETURNED_VERIFIER_SHA256; do
            [[ "${!tibicen_name}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          done

      - name: Read only the exact operations commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve the official artifact and compare all returned public bodies once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          for name, variable in [
              ('pages-audit.json', 'AUDIT_CONFIG_SHA256'),
              ('pages-audit.py', 'AUDIT_SCRIPT_SHA256'),
              ('pages-verify-returned.py', 'RETURNED_VERIFIER_SHA256'),
          ]:
              file = Path('.release-1.5.4') / name
              assert file.is_file() and not file.is_symlink()
              assert hashlib.sha256(file.read_bytes()).hexdigest() == os.environ[variable]
          PY
          python3 .release-1.5.4/pages-audit.py .release-1.5.4/pages-audit.json \
            "$RUNNER_TEMP/tibicen-1.5.4-pages-audit-$GITHUB_RUN_ID"

      - name: Retain official artifact and verification receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tibicen-1.5.4-pages-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tibicen-1.5.4-pages-audit-${{ github.run_id }}/*.json
            ${{ runner.temp }}/tibicen-1.5.4-pages-audit-${{ github.run_id }}/official-github-pages.zip
            ${{ runner.temp }}/tibicen-1.5.4-pages-audit-${{ github.run_id }}/returned-check/
          retention-days: 7
          if-no-files-found: warn
