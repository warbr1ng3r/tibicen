name: One-off Tibicen 1.5.2 operations

on:
  push:
    branches: [codex/release-1.5.2-ops]

permissions: {}

concurrency:
  group: release-1.5.2-ops
  cancel-in-progress: false


jobs:
  pages-audit:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'warbr1ng3r/tibicen' &&
      github.ref == 'refs/heads/codex/release-1.5.2-ops' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'release-1.5.2-ops: pages-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    env:
      AUDIT_CONFIG_SHA256: "55efe4d0466900e9fff19b34012a698d847e214ecfef6968fe516062542712c1"
      AUDIT_SCRIPT_SHA256: "27d5fe6c130e8a307b2de05ebb486dd09f3fa297a0a7435878c983b7b2445f97"
      RETURNED_VERIFIER_SHA256: "fd638d96cc52025c4b28fb60f9c7c05c4534c1c29b5b2267c7f9ae3fb89eb71a"
    steps:
      - name: Require exact reviewed hashes
        shell: bash
        run: |
          set -euo pipefail
          for tibicen_name in AUDIT_CONFIG_SHA256 AUDIT_SCRIPT_SHA256 RETURNED_VERIFIER_SHA256; do
            [[ "${!tibicen_name}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          done

      - name: Read only the exact operations commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve the official artifact and compare all returned public bodies once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          for name, variable in [
              ('pages-audit.json', 'AUDIT_CONFIG_SHA256'),
              ('pages-audit.py', 'AUDIT_SCRIPT_SHA256'),
              ('pages-verify-returned.py', 'RETURNED_VERIFIER_SHA256'),
          ]:
              file = Path('.release-1.5.2') / name
              assert file.is_file() and not file.is_symlink()
              assert hashlib.sha256(file.read_bytes()).hexdigest() == os.environ[variable]
          PY
          python3 .release-1.5.2/pages-audit.py .release-1.5.2/pages-audit.json \
            "$RUNNER_TEMP/tibicen-1.5.2-pages-audit-$GITHUB_RUN_ID"

      - name: Retain official artifact and verification receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tibicen-1.5.2-pages-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tibicen-1.5.2-pages-audit-${{ github.run_id }}/*.json
            ${{ runner.temp }}/tibicen-1.5.2-pages-audit-${{ github.run_id }}/official-github-pages.zip
            ${{ runner.temp }}/tibicen-1.5.2-pages-audit-${{ github.run_id }}/returned-check/
          retention-days: 7
          if-no-files-found: warn
