name: Manual standalone platform checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
        node: ['22.20.0', '24.15.0']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Build dependency-free standalone skills
        run: node scripts/build.ts

      - name: Set up target runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Check unpacked skills without Git or checkout dependencies
        env:
          TIBICEN_PORTABLE_DIST: ${{ github.workspace }}/dist
        run: node --test tests/skills/portable.test.ts
