name: One-off Tibicen 1.5.1 operations

on:
  push:
    branches: [codex/release-1.5.1-ops]

permissions: {}

concurrency:
  group: release-1.5.1-ops
  cancel-in-progress: false

env:
  SOURCE_SHA: "210e786fdac4a7aa90b88cd34e223788f4f097dd"

jobs:
  publish:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'warbr1ng3r/tibicen' &&
      github.ref == 'refs/heads/codex/release-1.5.1-ops' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'release-1.5.1-ops: publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      DISTRIBUTION_SHA: "287ef7b22630482aca7996e5a0faad601cede778"
      NOTES_SHA256: "db9608adcae004c209bdfaee54c2b940ebb854b14282469de411da4611a9d3f9"
      SOURCE_CI_RUN_ID: "42395772435"
      PLATFORM_RUN_ID: "42396159346"
      PUBLIC_DELIVERY_RECEIPT_SHA256: "204e57827bcead5e81ad0612baf952b3f22cdff46c97b432479ca3c0a8cef238"
      ARCHIVE_BYTES: "278907"
      ARCHIVE_SHA256: "eb2d256d2e30677e1c34476a5c52ab14ebc69bff0fc01577e3c3e9dc3ba2e9b9"
      DISTRIBUTION_SUMS_BYTES: "11559"
      DISTRIBUTION_SUMS_SHA256: "1c36d93471168d439f1540eac07fcde33916d096b860446d154b8973ea050961"
      OUTER_SUMS_BYTES: "177"
      OUTER_SUMS_SHA256: "bd39b6a1fc0c84698548a406b3fabcda45b879d357b74954b5f8310f32dbe8f7"
      PAYLOAD_FILES: "110"
      OLD_RELEASE_BASELINE_SHA256: "071b1ed60cf418f41a2ba82f41114cc699894b8dc4e4d3012d646f666bd33ef8"
      OLD_TAG_BASELINE_SHA256: "b29ccc79489ed30dfe0ed9e235b2e0c3fffa0716b6b69ab83a444fec3078e3dc"
    steps:
      - name: Require concrete reviewed bindings before reading the packet
        shell: bash
        run: |
          set -euo pipefail
          for tibicen_name in SOURCE_SHA DISTRIBUTION_SHA; do
            [[ "${!tibicen_name}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
          for tibicen_name in NOTES_SHA256 PUBLIC_DELIVERY_RECEIPT_SHA256 ARCHIVE_SHA256 DISTRIBUTION_SUMS_SHA256 OUTER_SUMS_SHA256 OLD_RELEASE_BASELINE_SHA256 OLD_TAG_BASELINE_SHA256; do
            [[ "${!tibicen_name}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          done
          for tibicen_name in SOURCE_CI_RUN_ID PLATFORM_RUN_ID ARCHIVE_BYTES DISTRIBUTION_SUMS_BYTES OUTER_SUMS_BYTES PAYLOAD_FILES; do
            [[ "${!tibicen_name}" =~ ^[1-9][0-9]*$ ]] || exit 1
          done

      - name: Read only the exact operations commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Decode the text-only transport once before packet verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import base64, hashlib, os
          root = Path('.release-1.5.1')
          assert root.is_dir() and not root.is_symlink()
          encoded = root / 'tibicen-1.5.1.tar.gz.base64'
          archive = root / 'tibicen-1.5.1.tar.gz'
          assert encoded.is_file() and not encoded.is_symlink()
          assert not archive.exists() and not archive.is_symlink()
          encoded_size = 4 * ((int(os.environ['ARCHIVE_BYTES']) + 2) // 3)
          assert encoded.stat().st_size in {encoded_size, encoded_size + 1}
          value = encoded.read_text(encoding='ascii').removesuffix('\n')
          data = base64.b64decode(value, validate=True)
          assert base64.b64encode(data).decode('ascii') == value
          assert len(data) == int(os.environ['ARCHIVE_BYTES'])
          assert hashlib.sha256(data).hexdigest() == os.environ['ARCHIVE_SHA256']
          with archive.open('xb') as output:
              output.write(data)
          encoded.unlink()
          PYCODE

      - name: Verify the exact candidate files and approved delivery receipt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re
          root = Path('.release-1.5.1')
          expected = {
              'tibicen-1.5.1.tar.gz': (int(os.environ['ARCHIVE_BYTES']), os.environ['ARCHIVE_SHA256']),
              'distribution-SHA256SUMS': (int(os.environ['DISTRIBUTION_SUMS_BYTES']), os.environ['DISTRIBUTION_SUMS_SHA256']),
              'SHA256SUMS': (int(os.environ['OUTER_SUMS_BYTES']), os.environ['OUTER_SUMS_SHA256']),
          }
          assert root.is_dir() and not root.is_symlink()
          assert {p.name for p in root.iterdir()} == {*expected, 'notes.md', 'public-delivery-receipt.json', 'latest-release.json', 'old-tag.json'}
          for name in [*expected, 'notes.md', 'public-delivery-receipt.json', 'latest-release.json', 'old-tag.json']:
              file = root / name
              assert file.is_file() and not file.is_symlink(), name
              data = file.read_bytes()
              if name in expected:
                  size, digest = expected[name]
                  assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, name
              else:
                  env_key = {'notes.md': 'NOTES_SHA256', 'public-delivery-receipt.json': 'PUBLIC_DELIVERY_RECEIPT_SHA256', 'latest-release.json': 'OLD_RELEASE_BASELINE_SHA256', 'old-tag.json': 'OLD_TAG_BASELINE_SHA256'}[name]
                  assert data and hashlib.sha256(data).hexdigest() == os.environ[env_key], name
          outer = ''.join(f"{expected[name][1]}  {name}\n" for name in ['tibicen-1.5.1.tar.gz', 'distribution-SHA256SUMS']).encode()
          assert (root / 'SHA256SUMS').read_bytes() == outer
          delivery_data = (root / 'public-delivery-receipt.json').read_text()
          delivery = json.loads(delivery_data)
          assert isinstance(delivery, dict)
          assert set(delivery) == {'status', 'distributionCommit', 'candidateArchiveSha256', 'payloadFiles', 'calls', 'preservationPassed', 'rawReceiptSha256', 'limits'}
          assert delivery['status'] == 'passed'
          assert delivery['distributionCommit'] == os.environ['DISTRIBUTION_SHA']
          assert delivery['candidateArchiveSha256'] == expected['tibicen-1.5.1.tar.gz'][1]
          assert delivery['payloadFiles'] == int(os.environ['PAYLOAD_FILES']) and delivery['calls'] == {'installer': 4, 'standalone': 2}
          assert delivery['preservationPassed'] is True
          assert re.fullmatch(r'[0-9a-f]{64}', delivery['rawReceiptSha256'])
          assert isinstance(delivery['limits'], list) and delivery['limits'] and all(isinstance(value, str) for value in delivery['limits'])
          assert not re.search(r'/Users/|/private/|/var/folders/|[A-Za-z]:\\|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', delivery_data)
          PY
          (cd .release-1.5.1 && sha256sum -c SHA256SUMS)

      - name: Verify actual source CI and all six platform jobs
        shell: bash
        run: |
          set -euo pipefail
          tibicen_gates="$(mktemp -d "$RUNNER_TEMP/tibicen-1.5.1-gates.XXXXXX")"
          trap 'rm -rf "$tibicen_gates"' EXIT
          for tibicen_pair in "source:$SOURCE_CI_RUN_ID" "platform:$PLATFORM_RUN_ID"; do
            tibicen_label="${tibicen_pair%%:*}"
            tibicen_run="${tibicen_pair#*:}"
            curl --disable --proto '=https' --connect-timeout 10 --max-time 30 --max-filesize 2097152 -fsS \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/warbr1ng3r/tibicen/actions/runs/$tibicen_run" \
              -o "$tibicen_gates/$tibicen_label-run.json"
            curl --disable --proto '=https' --connect-timeout 10 --max-time 30 --max-filesize 2097152 -fsS \
              -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2026-03-10' \
              "https://api.github.com/repos/warbr1ng3r/tibicen/actions/runs/$tibicen_run/jobs?per_page=100" \
              -o "$tibicen_gates/$tibicen_label-jobs.json"
          done
          python3 - "$tibicen_gates" <<'PY'
          from pathlib import Path
          import json, os, sys
          root = Path(sys.argv[1])
          for label, path, event, key in [
              ('source', '.github/workflows/ci.yml', 'push', 'SOURCE_CI_RUN_ID'),
              ('platform', '.github/workflows/platforms.yml', 'workflow_dispatch', 'PLATFORM_RUN_ID'),
          ]:
              run = json.loads((root / f'{label}-run.json').read_text())
              assert run['id'] == int(os.environ[key])
              assert (run['head_sha'], run['head_branch'], run['path'], run['event']) == (os.environ['SOURCE_SHA'], 'main', path, event)
              assert (run['status'], run['conclusion']) == ('completed', 'success')
              assert run['run_attempt'] == 1
              jobs_response = json.loads((root / f'{label}-jobs.json').read_text())
              jobs = jobs_response['jobs']
              expected = {'checks'} if label == 'source' else {
                  f'standalone ({platform}, {node})'
                  for platform in ['macos-15', 'ubuntu-24.04', 'windows-2022']
                  for node in ['22.20.0', '24.15.0']
              }
              assert jobs_response['total_count'] == len(jobs) == len(expected)
              assert {job['name'] for job in jobs} == expected
              assert all((job['status'], job['conclusion']) == ('completed', 'success') for job in jobs)
          print('Exact-source normal CI and all six platform jobs passed; reviewed public delivery receipt is bound separately.')
          PY

      - name: Verify source, old release and new tag/release absence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tibicen_release_audit="$(mktemp -d "$RUNNER_TEMP/tibicen-1.5.1-release-audit.XXXXXX")"
          trap 'rm -rf "$tibicen_release_audit"' EXIT
          test "$(gh api repos/warbr1ng3r/tibicen/git/ref/heads/main --jq .object.sha)" = "$SOURCE_SHA"
          gh api repos/warbr1ng3r/tibicen/releases/latest > "$tibicen_release_audit/latest.json"
          gh api repos/warbr1ng3r/tibicen/releases/tags/v1.5.0 > "$tibicen_release_audit/old-release.json"
          gh api repos/warbr1ng3r/tibicen/git/ref/tags/v1.5.0 > "$tibicen_release_audit/old-tag.json"
          python3 - "$tibicen_release_audit" <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, sys
          root = Path(sys.argv[1])
          packet = Path('.release-1.5.1')
          def baseline(name, variable):
              file = packet / name
              assert file.is_file() and not file.is_symlink(), name
              data = file.read_bytes()
              assert hashlib.sha256(data).hexdigest() == os.environ[variable], name
              return json.loads(data)
          before = baseline('latest-release.json', 'OLD_RELEASE_BASELINE_SHA256')
          before_tag = baseline('old-tag.json', 'OLD_TAG_BASELINE_SHA256')
          assert before['tag_name'] == 'v1.5.0' and not before['draft'] and not before['prerelease']
          assert type(before['id']) is int and before['id'] > 0
          assert before_tag['ref'] == 'refs/tags/v1.5.0' and before_tag['object']['type'] == 'tag'
          assert re.fullmatch(r'[0-9a-f]{40}', before_tag['object']['sha'])
          latest = json.loads((root / 'latest.json').read_text())
          old = json.loads((root / 'old-release.json').read_text())
          old_tag = json.loads((root / 'old-tag.json').read_text())
          assert latest['id'] == old['id'] == before['id']
          for key in ['id', 'tag_name', 'name', 'draft', 'prerelease', 'published_at', 'updated_at', 'body', 'target_commitish', 'html_url']:
              assert old[key] == before[key], key
          assert old_tag == before_tag, 'Published 1.5.0 tag changed'
          expected_names = {'tibicen-1.5.0.tar.gz', 'distribution-SHA256SUMS', 'SHA256SUMS'}
          assert len(before['assets']) == len(old['assets']) == 3
          assert {asset['name'] for asset in before['assets']} == expected_names
          assert {asset['name'] for asset in old['assets']} == expected_names
          expected = {asset['name']: asset for asset in before['assets']}
          for asset in old['assets']:
              assert asset['state'] == 'uploaded'
              assert re.fullmatch(r'sha256:[0-9a-f]{64}', asset['digest'])
              for key in ['id', 'name', 'size', 'digest', 'state', 'created_at', 'updated_at', 'browser_download_url']:
                  assert asset[key] == expected[asset['name']][key], (asset['name'], key)
          PY
          existing="$(gh api --paginate 'repos/warbr1ng3r/tibicen/releases?per_page=100' --jq '.[] | select(.tag_name == "v1.5.1") | .id')"
          test -z "$existing"
          tibicen_status="$(curl --disable --proto '=https' --connect-timeout 10 --max-time 30 --max-filesize 1048576 -sS \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -o "$tibicen_release_audit/new-release.json" -w '%{http_code}' \
            https://api.github.com/repos/warbr1ng3r/tibicen/releases/tags/v1.5.1)"
          test "$tibicen_status" = 404
          tibicen_tag_status="$(curl --disable --proto '=https' --connect-timeout 10 --max-time 30 --max-filesize 1048576 -sS \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            -o "$tibicen_release_audit/new-tag.json" -w '%{http_code}' \
            https://api.github.com/repos/warbr1ng3r/tibicen/git/ref/tags/v1.5.1)"
          test "$tibicen_tag_status" = 404
          gh api "repos/warbr1ng3r/tibicen/git/commits/$DISTRIBUTION_SHA" --jq .sha > "$tibicen_release_audit/distribution-commit"
          test "$(cat "$tibicen_release_audit/distribution-commit")" = "$DISTRIBUTION_SHA"

      - name: Create the exact annotated tag once without overwriting any ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/warbr1ng3r/tibicen/git/ref/heads/main --jq .object.sha)" = "$SOURCE_SHA"
          tibicen_tag_directory="$(mktemp -d "$RUNNER_TEMP/tibicen-1.5.1-tag.XXXXXX")"
          trap 'rm -rf "$tibicen_tag_directory"' EXIT
          python3 - <<'PYCODE' > "$tibicen_tag_directory/create-tag.json"
          import json, os
          print(json.dumps({'tag': 'v1.5.1', 'message': 'Tibicen 1.5.1\nSource: ' + os.environ['SOURCE_SHA'] + '\nArchive SHA256: ' + os.environ['ARCHIVE_SHA256'],
                            'object': os.environ['DISTRIBUTION_SHA'], 'type': 'commit'}))
          PYCODE
          gh api --method POST repos/warbr1ng3r/tibicen/git/tags \
            --input "$tibicen_tag_directory/create-tag.json" > "$tibicen_tag_directory/tag-object.json"
          python3 - "$tibicen_tag_directory" <<'PYCODE'
          from pathlib import Path
          import json, os, re, sys
          root = Path(sys.argv[1])
          obj = json.loads((root / 'tag-object.json').read_text())
          assert re.fullmatch(r'[0-9a-f]{40}', obj['sha'])
          assert obj['tag'] == 'v1.5.1'
          assert obj['message'].rstrip('\n') == 'Tibicen 1.5.1\nSource: ' + os.environ['SOURCE_SHA'] + '\nArchive SHA256: ' + os.environ['ARCHIVE_SHA256']
          assert obj['object']['type'] == 'commit' and obj['object']['sha'] == os.environ['DISTRIBUTION_SHA']
          (root / 'create-ref.json').write_text(json.dumps({'ref': 'refs/tags/v1.5.1', 'sha': obj['sha']}) + '\n')
          PYCODE
          gh api --method POST repos/warbr1ng3r/tibicen/git/refs \
            --input "$tibicen_tag_directory/create-ref.json" > "$tibicen_tag_directory/created-ref.json"
          gh api repos/warbr1ng3r/tibicen/git/ref/tags/v1.5.1 > "$tibicen_tag_directory/observed-ref.json"
          python3 - "$tibicen_tag_directory" <<'PYCODE'
          from pathlib import Path
          import json, os, sys
          root = Path(sys.argv[1])
          obj = json.loads((root / 'tag-object.json').read_text())
          for name in ['created-ref.json', 'observed-ref.json']:
              ref = json.loads((root / name).read_text())
              assert ref['ref'] == 'refs/tags/v1.5.1'
              assert ref['object']['type'] == 'tag' and ref['object']['sha'] == obj['sha']
          print(json.dumps({'annotatedTag': 'v1.5.1', 'tagObject': obj['sha'], 'distributionCommit': os.environ['DISTRIBUTION_SHA'],
                            'tagObjectCreateAttempts': 1, 'tagRefCreateAttempts': 1}))
          PYCODE

      - name: Create 1.5.1 once with exactly three assets and reviewed notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/warbr1ng3r/tibicen/git/ref/heads/main --jq .object.sha)" = "$SOURCE_SHA"
          gh release create v1.5.1 \
            .release-1.5.1/tibicen-1.5.1.tar.gz .release-1.5.1/distribution-SHA256SUMS .release-1.5.1/SHA256SUMS \
            --repo warbr1ng3r/tibicen --verify-tag --title 'Tibicen 1.5.1' \
            --notes-file .release-1.5.1/notes.md --latest
