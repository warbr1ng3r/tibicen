name: One-off Tibicen 1.5.1 operations

on:
  push:
    branches: [codex/release-1.5.1-ops]

permissions: {}

concurrency:
  group: release-1.5.1-ops
  cancel-in-progress: false


jobs:
  pages-audit:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'warbr1ng3r/tibicen' &&
      github.ref == 'refs/heads/codex/release-1.5.1-ops' &&
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'release-1.5.1-ops: pages-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
      actions: read
    env:
      AUDIT_CONFIG_SHA256: "0d4c7be18274378c208dc00877b9820559c2fd60d927417b120ce07f4cda9c3f"
      AUDIT_SCRIPT_SHA256: "7418a1b9ce0c343033543842ab66c867db955a7db70a79f36c2046b028bf134a"
      RETURNED_VERIFIER_SHA256: "3b0229e4ab2f5d9cc0a6a023679d7cc678e17de4bf882be208acd14919b937cf"
    steps:
      - name: Require exact reviewed hashes
        shell: bash
        run: |
          set -euo pipefail
          for tibicen_name in AUDIT_CONFIG_SHA256 AUDIT_SCRIPT_SHA256 RETURNED_VERIFIER_SHA256; do
            [[ "${!tibicen_name}" =~ ^[0-9a-f]{64}$ ]] || exit 1
          done

      - name: Read only the exact operations commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Retrieve the official artifact and compare all returned public bodies once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          for name, variable in [
              ('pages-audit.json', 'AUDIT_CONFIG_SHA256'),
              ('pages-audit.py', 'AUDIT_SCRIPT_SHA256'),
              ('pages-verify-returned.py', 'RETURNED_VERIFIER_SHA256'),
          ]:
              file = Path('.release-1.5.1') / name
              assert file.is_file() and not file.is_symlink()
              assert hashlib.sha256(file.read_bytes()).hexdigest() == os.environ[variable]
          PY
          python3 .release-1.5.1/pages-audit.py .release-1.5.1/pages-audit.json \
            "$RUNNER_TEMP/tibicen-1.5.1-pages-audit-$GITHUB_RUN_ID"

      - name: Retain official artifact and verification receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tibicen-1.5.1-pages-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tibicen-1.5.1-pages-audit-${{ github.run_id }}/*.json
            ${{ runner.temp }}/tibicen-1.5.1-pages-audit-${{ github.run_id }}/official-github-pages.zip
            ${{ runner.temp }}/tibicen-1.5.1-pages-audit-${{ github.run_id }}/returned-check/
          retention-days: 7
          if-no-files-found: warn
